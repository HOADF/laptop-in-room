<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Интерактивный Ноутбук</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stage">
        <div class="laptop">
            <div class="laptop-screen">
                <div class="webcam-led" id="webcam-led" title="Индикатор камеры"></div>
                <div class="screen-content">

                    <div class="os-window" id="app-window">
                        <header class="window-header">
                            <span class="window-title">Моё портфолио</span>
                            <div class="window-controls">
                                <span>_</span><span>[]</span><span>X</span>
                            </div>
                        </header>
                        <main class="window-body" id="page-content">
                            <h2>Добро пожаловать!</h2>
                            <p>Я создаю интерактивные решения и ценю нестандартный подход к деталям. Этот сайт — моя цифровая мастерская.</p>
                        </main>
                    </div>

                    <div class="taskbar">
                        <button class="start-btn" id="start-button">
                            <svg viewBox="0 0 24 24"><path d="M0 0h11v11H0zM12 0h12v11H12zM0 12h11v12H0zM12 12h12v12H12z" fill="#fff"/></svg>
                        </button>

                        <div class="search-box">
                            <input type="text" id="win-search" placeholder="Поиск по сайту...">
                        </div>

                        <nav class="taskbar-nav">
                            <button class="nav-item" data-page="about">Обо мне</button>
                            <button class="nav-item" data-page="services">Услуги</button>
                            <button class="nav-item" data-page="contacts">Контакты</button>
                        </nav>
                    </div>

                    <div class="start-menu" id="start-menu">
                        <h3>Главное меню</h3>
                        <ul>
                            <li data-page="about">Обо мне</li>
                            <li data-page="services">Мои услуги</li>
                            <li data-page="contacts">Связаться со мной</li>
                        </ul>
                    </div>

                </div>
            </div>
            <!-- Передний край корпуса (под экраном) — здесь, как на настоящих
                 ноутбуках, виден ряд индикаторов, если смотреть на корпус
                 сбоку/спереди: питание и активность диска. -->
            <div class="laptop-base">
                <div class="status-leds">
                    <span class="led led-power" title="Питание"></span>
                    <span class="led led-activity" title="Активность диска"></span>
                </div>
                <div class="touchpad"></div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
